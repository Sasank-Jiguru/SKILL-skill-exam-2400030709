services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_DB: soataskdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d soataskdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: sasankjiguru/insurancepolicy-backend:latest
    container_name: backend-service
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "2006:2006"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/soataskdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 2006
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
